<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>LEON Admin</title>

<style>

body{
margin:0;
background:radial-gradient(circle,#3b006b,#000);
color:white;
font-family:tahoma;
text-align:center;
}

.box{
margin:50px auto;
width:80%;
padding:30px;
background:#ffffff15;
border-radius:30px;
backdrop-filter:blur(15px);
}

button{
padding:15px 30px;
margin:10px;
border:0;
border-radius:20px;
background:#9333ea;
color:white;
cursor:pointer;
}

textarea{
width:90%;
padding:15px;
margin:10px;
border-radius:15px;
border:0;
}

</style>

</head>


<body>


<div class="box">

<h1>👑 پنل مدیریت LEON</h1>

<h2>ویرایش متن سایت</h2>


<textarea id="text" rows="8"></textarea>


<br>


<button onclick="save()">
ذخیره در سایت
</button>


<button onclick="location.href='index.html'">
بازگشت
</button>


<p id="msg"></p>


</div>



<script>


if(localStorage.getItem("LEON_ADMIN")!="true"){
location.href="login.html";
}



const API =
"https://leon-api.zxczghf1452hcz.workers.dev";




// گرفتن متن فعلی

async function load(){

let res = await fetch(API+"/settings");

let data = await res.json();


document.getElementById("text").value =
data.description || "";

}



load();





// ذخیره

async function save(){


let value =
document.getElementById("text").value;



let res = await fetch(API+"/save-settings",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

siteName:"LEON",

description:value

})


});



if(res.ok){

document.getElementById("msg").innerHTML=
"ذخیره شد ✅";

}else{

document.getElementById("msg").innerHTML=
"خطا در ذخیره ❌";

}



}



</script>


</body>
</html>
